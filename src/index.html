<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windblown's Affix Calculator</title>
  <script>
  (function() {
    const savedTheme = localStorage.getItem('windblownCalculatorTheme');
    if (savedTheme) {
      document.documentElement.classList.add(savedTheme === 'light' ? 'view-light' : 'view-dark');
    } else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.add(prefersDark ? 'view-dark' : 'view-light');
    }
  })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
  <div class="fixed-header">
    <div class="logo-container">
      <img src="./assets/wac-logo.png" alt="Windblown's affixes calculator" style="height:40px; margin-top:6px" />
    </div>

    <div class="lang-toggle">
      <button id="langToggleBtn" class="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Switch language">
        <span id="langLabel" class="lang-label">EN</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div id="langDropdown" class="lang-dropdown" role="listbox" hidden>
        <button type="button" class="lang-option" data-lang="en" role="option" aria-selected="true">English</button>
        <button type="button" class="lang-option" data-lang="fr" role="option" aria-selected="false">Français</button>
      </div>
    </div>

    <div class="theme-toggle">
      <button id="themeToggleBtn" class="theme-btn" aria-label="Toggle theme">
        <span class="theme-label">Switch to Light</span>
      </button>
    </div>
  </div>

  
  <div class="calculator">
    <!-- Rare Affix Upgrades -->
    <div class="form-group">
      <div id="upgradeSelection" class="upgrade-selection"></div>
    </div>
    
    <!-- Gear Type Selection -->
    <div class="form-group">
      <div id="gearTypeSelection" class="gear-type-selection"></div>
    </div>

    <!-- Gear and Level Selection (Side by Side) -->
    <div class="form-row">
      <div class="form-group half-width">
        <div class="custom-gear-selector">
          <button type="button" id="gearSelectButton" class="gear-select-button" aria-haspopup="listbox" aria-expanded="false">
            <span id="gearSelectIcon" class="gear-icon"></span>
            <span id="gearSelectLabel" class="gear-label">Fetching icons from the wiki...</span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <div id="gearSelectDropdown" class="gear-dropdown" role="listbox" hidden>
          </div>
          <input type="hidden" id="gearSelect" value="">
        </div>
      </div>
    
      <div class="form-group half-width">
        <input type="number" id="levelInput" min="1" class="level-input" placeholder="Enter level (e.g., 5)">
	<small id="levelNote"></small>
      </div>
    </div>

    <!-- Affixes Selection -->
    <div class="form-group">
      <div id="affixSelection"></div>
    </div>
    
    <!-- Sticky Bottom Result Box -->
    <div id="stickyResult" class="sticky-result">
      <div class="result-content">
        <span class="result-label">Your Choice Odds:</span>
        <span id="resultValue" class="result-value">-</span>
	<span id="resultRerolls" class="result-rerolls"></span>
      </div>
      <div class="copyright-notice">
      </div>
    </div>
    
    <!-- Results -->
    <div id="result" class="result-container"></div>
  </div>
  <script src="settings.js"></script>
  <script src="probability.js"></script>
  <script src="app.js"></script>
</body>
</html>
