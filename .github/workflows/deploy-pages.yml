name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Fetch wiki data
        run: node scripts/fetch-wiki-data.js
      - uses: actions/configure-pages@v5
      - name: Stage deploy folder
        run: |
          mkdir -p _deploy/data
          cp -r src/* _deploy/
          cp -r data/* _deploy/data/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_deploy
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
